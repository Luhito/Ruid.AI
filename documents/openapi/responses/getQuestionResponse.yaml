description: 問題を取得しました。

content:
  application/json:
    schema:
      type: object
      required:
        - room_id
        - question_text
        - choices
        - correct_answer_index
        - explanation_text
        - answered_flg
        - summary

      properties:
        room_id:
          type: string
          description: Room ID
          format: uuid

        question_text:
          type: string
          description: 問題文（Markdown）
          example: |
            テスト用問題文
            改行もあるよ
            **how's the bold letter?**

        choices:
          type: array
          description: 選択肢配列. 選択肢を表す記号と選択肢の本文のセット
          items:
            type: object
            required:
              - tag
              - text
            properties:
              tag:
                type: string
              text:
                type: string
          example:
            - tag: A
              text: choice1
            - tag: B
              text: choice2

        correct_answer_index:
          type: integer
          description: 選択肢の中で、正解のインデックス
          example: 1

        explanation_text:
          type: string
          description: 解説文（Markdown）
          example: |
            ここに説明が表示されるはずです
            **それも、マークダウンで！**
        
        answered_flg:
          type: boolean
          description: 回答済みフラグ

        summary:
          type: string
          description: 問題の短い説明