type: object

required:
  - statusCode
  - errorCode
  - content

properties:
  statusCode:
    type: number
    description: HTTPステータスコード
    example: 500

  errorCode:
    type: string
    description: エラーコード
    example: VALIDATION_ERROR

  headers:
    type: object
    description: ヘッダー（ここでは使わないが、他の正常レスポンスとの共通化をはかる）
    example: ""

  content:
    type: object
    required:
      - message
    
    properties:
      message:
        type: string
        description: エラーメッセージ
        example: qidはUUID形式で指定してください。