description: 問題リストを取得しました。

content:
  application/json:
    schema:
      type: array
      items:
        type: object
        required:
          - question_id
          - summary

        properties:
          question_id:
            type: string
            description: Question ID
            format: uuid

          summary:
            type: string
            description: 問題要約
            