post:
  tags:
    - Question

  summary: 問題作成
  description: |
    指定された条件をもとに新しい問題を作成します。

    リクエストボディには、問題ジャンルや問題形式などの生成条件を指定します。

    作成に成功した場合は201 Createdを返し、Locationヘッダーに作成した問題のリソースURIを設定します。

  operationId: postQuestion

  requestBody:
    $ref: '../openapi.yaml#/components/requestBodies/Qprompt'
      
  responses:
    '201':
      $ref: '../openapi.yaml#/components/responses/CreateQuestionResponse'

    '400':
      description: バリデーションエラー
      content:
        application/json:
          schema:
            $ref: '../openapi.yaml#/components/responses/ErrorResponse'

    '401':
      description: 認証エラー
      content:
        application/json:
          schema:
            $ref: '../openapi.yaml#/components/responses/ErrorResponse'

    '404':
      description: 問題が存在しない
      content:
        application/json:
          schema:
            $ref: '../openapi.yaml#/components/responses/ErrorResponse'
            
    '500':
      description: Internal server error
      content:
        application/json:
          schema:
            $ref: '../openapi.yaml#/components/responses/ErrorResponse'
