get:
  tags:
    - Room
  
  sumamry: 次の問題の問題ID取得
  description: |
    ルームIDから、そのルーム内で未回答の問題を取得します。

    - 問題ID
    を返します。

    未回答の問題が存在しない場合は404を返します。
  
  operationId: getNewQuestionId

  parameters:
    - name: room_id
      description: パスパラメータ内のroom_id
      in: path
      required: true
      schema:
        type: string
        format: uuid
      
  responses:
    '200':
      $ref: '../openapi.yaml#/components/responses/GetNewQuestionIdResponse'
    '400':
      $ref: '../openapi.yaml#/components/responses/ErrorResponse'
    '401':
      $ref: '../openapi.yaml#/components/responses/ErrorResponse'
    '404':
      $ref: '../openapi.yaml#/components/responses/ErrorResponse'
    '500':
      $ref: '../openapi.yaml#/components/responses/ErrorResponse'