get:
  tags:
    - Question

  summary: 問題取得
  description: |
        指定した問題IDに対応する問題を取得します。

        - 問題文
        - 選択肢
        - 解説
        を返します。

        問題が存在しない場合は404を返します。
  operationId: getQuestion

  parameters:
    - $ref: '../openapi.yaml#/components/parameters/Qid'
      
  responses:
    '200':
      $ref: '../openapi.yaml#/components/responses/GetQuestionResponse'

    '400':
      description: バリデーションエラー
      content:
        application/json:
          schema:
            $ref: '../openapi.yaml#/components/responses/ErrorResponse'

    '401':
      description: 認証エラー
      content:
        application/json:
          schema:
            $ref: '../openapi.yaml#/components/responses/ErrorResponse'

    '404':
      description: 問題が存在しない
      content:
        application/json:
          schema:
            $ref: '../openapi.yaml#/components/responses/ErrorResponse'
            
    '500':
      description: Internal server error
      content:
        application/json:
          schema:
            $ref: '../openapi.yaml#/components/responses/ErrorResponse'