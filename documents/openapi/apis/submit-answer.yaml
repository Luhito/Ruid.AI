post:
  tags:
    - Question
  
  summary: 問題に回答
  description: |
    指定した問題IDの指定したindexの解答が正しいかを返します。
  
  operationId: submitAnswer
  
  security: 
    - BearerAuth: []
  
  parameters:
    - name: question_id
      description: パスパラメータ内のquestion_id
      in: path
      required: true
      schema:
        type: string
        format: uuid
  
  requestBody:
    $ref: ../requestBodies/submitAnswerBody.yaml
     
  responses:
    '200':
      $ref: '../openapi.yaml#/components/responses/SubmitAnswerResponse'
    '400':
      $ref: '../openapi.yaml#/components/responses/ErrorResponse'
    '401':
      $ref: '../openapi.yaml#/components/responses/ErrorResponse'
    '404':
      $ref: '../openapi.yaml#/components/responses/ErrorResponse'
    '500':
      $ref: '../openapi.yaml#/components/responses/ErrorResponse'