openapi: 3.0.3

info:
  title: Ruid.ai API
  version: 1.0.0
  description: Ruid.ai API一覧

servers:
  - url: http://localhost:3030

tags:
  # - name: Auth
  #   description: 認証API

  - name: Question
    description: 問題取得API
    
  - name: Room
    description: 問題グループ取得API

paths:
  # /auth/login:
  #   $ref: './apis/login.yaml'

  # /auth/register:
  #   $ref: './apis/register.yaml'

  /questions/{question_id}:
    $ref: './apis/questions/_question_id/questions-by-id.yaml'
  
  /questions/{question_id}/answers:
    $ref: './apis/submit-answer.yaml'

  /rooms:
    $ref: './apis/rooms.yaml'
  
  /rooms/{room_id}:
    $ref: './apis/room-by-id.yaml'
  
  /rooms/{room_id}/questions:
    $ref: './apis/questions-by-room-id.yaml'
  
  /rooms/{room_id}/questions/next:
    $ref: './apis/room-next-question.yaml'

components:
  # schemas:
  #   RegisterRequest:
  #     $ref: './schemas/register-request.yaml'

  #   LoginRequest:
  #     $ref: './schemas/login-request.yaml'

  #   User:
  #     $ref: './schemas/user.yaml'
  
  requestBodies:
    Qprompt:
      $ref: './requestBodies/qprompt.yaml'
    
    SubmitAnswerBody:
      $ref: './requestBodies/submitAnswerBody.yaml'

  responses:
    ErrorResponse:
      $ref: './responses/errorResponse.yaml'
      
    # AuthResponse:
    #   $ref: './responses/authResponse.yaml'
      
    GetQuestionResponse:
      $ref: './apis/questions/_question_id/getQuestionResponse.yaml'
    
    CreateRoomResponse:
      $ref: './responses/createRoomResponse.yaml'

    GetRoomResponse:
      $ref: './responses/getRoomResponse.yaml'
    
    GetQuestionsByRoomIdResponse:
      $ref: './responses/getQuestionsByRoomIdResponse.yaml'

    GetNewQuestionIdResponse:
      $ref: './responses/getNewQuestionIdResponse.yaml'
    
    SubmitAnswerResponse:
      $ref: './responses/submitAnswerResponse.yaml'
    
  headers:
    Location:
      $ref: './headers/location.yaml'
    
    SetCookie:
      $ref: './headers/set-cookie.yaml'
    
    WWWAuthenticate:
      $ref: './headers/www-authenticate.yaml'

  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

